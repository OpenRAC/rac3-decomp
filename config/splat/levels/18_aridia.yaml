# Aridia (level 18): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_18
sha1: cacebbfe178be73d42a950584a58ebd00d6f8bac
options:
  basename: level_18
  target_path: baserom/levels/18_aridia.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/18_aridia/splat_assets
  asm_path: asm/levels/18_aridia
  src_path: build/levels/18_aridia/src
  ld_script_path: build/levels/18_aridia/18_aridia.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/18_aridia/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/18_aridia/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/18_aridia/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xD0280, vram: 0x2A4900}
  - {name: lvl_vtbl, type: data, start: 0x122A00, vram: 0x2F7080}
  - {name: lvl_camvtbl, type: data, start: 0x123A00, vram: 0x2F8080}
  - {name: lvl_sndvtbl, type: data, start: 0x123B00, vram: 0x2F8180}
  - name: text
    type: code
    start: 0x123B80
    vram: 0x2F8200
    subsegments:
      - [0x123B80, c, text]
  - {name: trailer, type: bin, start: 0x360428}
  - [0x3605D4]
