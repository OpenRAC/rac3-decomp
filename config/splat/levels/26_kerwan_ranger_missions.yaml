# Kerwan Ranger Missions (level 26): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_26
sha1: b57ca607149c28f044267a752cd267f8c59e091e
options:
  basename: level_26
  target_path: baserom/levels/26_kerwan_ranger_missions.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/26_kerwan_ranger_missions/splat_assets
  asm_path: asm/levels/26_kerwan_ranger_missions
  src_path: build/levels/26_kerwan_ranger_missions/src
  ld_script_path: build/levels/26_kerwan_ranger_missions/26_kerwan_ranger_missions.splat.ld
  compiler: EEGCC
