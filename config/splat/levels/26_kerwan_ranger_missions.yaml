  undefined_syms_auto_path: build/levels/26_kerwan_ranger_missions/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xCFB80, vram: 0x2A4200}
  - {name: lvl_vtbl, type: data, start: 0x122000, vram: 0x2F6680}
  - {name: lvl_camvtbl, type: data, start: 0x122F00, vram: 0x2F7580}
  - {name: lvl_sndvtbl, type: data, start: 0x123000, vram: 0x2F7680}
  - name: text
    type: code
    start: 0x123080
    vram: 0x2F7700
    subsegments:
      - [0x123080, c, text]
  - {name: trailer, type: bin, start: 0x3565E0}
  - [0x35678C]
