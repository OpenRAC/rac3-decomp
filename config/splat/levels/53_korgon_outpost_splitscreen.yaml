# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x241A00}
  - {name: data, type: data, start: 0x167B80, vram: 0x3A8580}
  - {name: lvl_vtbl, type: data, start: 0x18B800, vram: 0x3CC200}
  - {name: lvl_camvtbl, type: data, start: 0x18C880, vram: 0x3CD280}
  - {name: lvl_sndvtbl, type: data, start: 0x18C980, vram: 0x3CD380}
  - name: text
    type: code
    start: 0x18CA00
    vram: 0x3CD400
    subsegments:
      - [0x18CA00, c, text]
  - {name: trailer, type: bin, start: 0x313628}
  - [0x3137D4]
