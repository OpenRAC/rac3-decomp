# Aquatos Sewers (multiplayer) (level 48): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_48
sha1: 448f4477bcf0131b0eb5317bd11198a65b2f1600
options:
  basename: level_48
  target_path: baserom/levels/48_aquatos_sewers_mp.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/48_aquatos_sewers_mp/splat_assets
  asm_path: asm/levels/48_aquatos_sewers_mp
  src_path: build/levels/48_aquatos_sewers_mp/src
  ld_script_path: build/levels/48_aquatos_sewers_mp/48_aquatos_sewers_mp.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/48_aquatos_sewers_mp/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/48_aquatos_sewers_mp/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/48_aquatos_sewers_mp/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x241A00}
  - {name: data, type: data, start: 0x167E00, vram: 0x3A8800}
  - {name: lvl_vtbl, type: data, start: 0x18B900, vram: 0x3CC300}
  - {name: lvl_camvtbl, type: data, start: 0x18C680, vram: 0x3CD080}
  - {name: lvl_sndvtbl, type: data, start: 0x18C780, vram: 0x3CD180}
  - name: text
    type: code
    start: 0x18C800
    vram: 0x3CD200
    subsegments:
      - [0x18C800, c, text]
  - {name: trailer, type: bin, start: 0x3005E8}
  - [0x300794]
