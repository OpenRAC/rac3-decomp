# Outpost X12 (level 42): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_42
sha1: 8ec23ac1905d1a76d41c5ee0a7a8fe9577c1a284
options:
  basename: level_42
  target_path: baserom/levels/42_outpost_x12.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/42_outpost_x12/splat_assets
  asm_path: asm/levels/42_outpost_x12
  src_path: build/levels/42_outpost_x12/src
  ld_script_path: build/levels/42_outpost_x12/42_outpost_x12.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/42_outpost_x12/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/42_outpost_x12/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/42_outpost_x12/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x241A00}
  - {name: data, type: data, start: 0x156D00, vram: 0x397700}
  - {name: lvl_vtbl, type: data, start: 0x17AA80, vram: 0x3BB480}
  - {name: lvl_camvtbl, type: data, start: 0x17BC00, vram: 0x3BC600}
  - {name: lvl_sndvtbl, type: data, start: 0x17BD00, vram: 0x3BC700}
  - name: text
    type: code
    start: 0x17BD80
    vram: 0x3BC780
    subsegments:
      - [0x17BD80, c, text]
  - {name: trailer, type: bin, start: 0x304F40}
  - [0x3050EC]
