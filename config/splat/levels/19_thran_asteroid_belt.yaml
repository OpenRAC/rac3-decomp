# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xD1F80, vram: 0x2A6600}
  - {name: lvl_vtbl, type: data, start: 0x124A00, vram: 0x2F9080}
  - {name: lvl_camvtbl, type: data, start: 0x125800, vram: 0x2F9E80}
  - {name: lvl_sndvtbl, type: data, start: 0x125900, vram: 0x2F9F80}
  - name: text
    type: code
    start: 0x125980
    vram: 0x2FA000
    subsegments:
      - [0x125980, c, text]
  - {name: trailer, type: bin, start: 0x33F160}
  - [0x33F30C]
