# Veldin (level 1): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_01
sha1: aab9a95641fa24e3acaec9c04369e942b3689e38
options:
  basename: level_01
  target_path: baserom/levels/01_veldin.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/01_veldin/splat_assets
  asm_path: asm/levels/01_veldin
  src_path: build/levels/01_veldin/src
  ld_script_path: build/levels/01_veldin/01_veldin.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/01_veldin/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/01_veldin/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/01_veldin/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xCFD80, vram: 0x2A4400}
  - {name: lvl_vtbl, type: data, start: 0x122180, vram: 0x2F6800}
  - {name: lvl_camvtbl, type: data, start: 0x123000, vram: 0x2F7680}
  - {name: lvl_sndvtbl, type: data, start: 0x123100, vram: 0x2F7780}
  - name: text
    type: code
    start: 0x123180
    vram: 0x2F7800
    subsegments:
      - [0x123180, c, text]
  - {name: trailer, type: bin, start: 0x34D648}
  - [0x34D7F4]
