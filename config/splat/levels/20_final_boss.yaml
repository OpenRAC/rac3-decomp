# Final Boss (level 20): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_20
sha1: 307bb72dc2327ac7e9df9429261d56d275d93add
options:
  basename: level_20
  target_path: baserom/levels/20_final_boss.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/20_final_boss/splat_assets
  asm_path: asm/levels/20_final_boss
  src_path: build/levels/20_final_boss/src
  ld_script_path: build/levels/20_final_boss/20_final_boss.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/20_final_boss/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/20_final_boss/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/20_final_boss/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xD9700, vram: 0x2ADD80}
  - {name: lvl_vtbl, type: data, start: 0x12BE00, vram: 0x300480}
  - {name: lvl_camvtbl, type: data, start: 0x12CC00, vram: 0x301280}
  - {name: lvl_sndvtbl, type: data, start: 0x12CD00, vram: 0x301380}
  - name: text
    type: code
    start: 0x12CD80
    vram: 0x301400
    subsegments:
      - [0x12CD80, c, text]
  - {name: trailer, type: bin, start: 0x36D690}
  - [0x36D83C]
