# Rilgar (level 12): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_12
sha1: 89c3cf2eaba79c56a0ecb07c53ca73da2b443ea2
options:
  basename: level_12
  target_path: baserom/levels/12_rilgar.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/12_rilgar/splat_assets
  asm_path: asm/levels/12_rilgar
  src_path: build/levels/12_rilgar/src
  ld_script_path: build/levels/12_rilgar/12_rilgar.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/12_rilgar/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/12_rilgar/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/12_rilgar/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xCFC80, vram: 0x2A4300}
  - {name: lvl_vtbl, type: data, start: 0x122180, vram: 0x2F6800}
  - {name: lvl_camvtbl, type: data, start: 0x123080, vram: 0x2F7700}
  - {name: lvl_sndvtbl, type: data, start: 0x123180, vram: 0x2F7800}
  - name: text
    type: code
    start: 0x123200
    vram: 0x2F7880
    subsegments:
      - [0x123200, c, text]
  - {name: trailer, type: bin, start: 0x34ED90}
  - [0x34EF3C]
