# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x241A00}
  - {name: data, type: data, start: 0x16FE00, vram: 0x3B0800}
  - {name: lvl_vtbl, type: data, start: 0x193B80, vram: 0x3D4580}
  - {name: lvl_camvtbl, type: data, start: 0x194D00, vram: 0x3D5700}
  - {name: lvl_sndvtbl, type: data, start: 0x194E00, vram: 0x3D5800}
  - name: text
    type: code
    start: 0x194E80
    vram: 0x3D5880
    subsegments:
      - [0x194E80, c, text]
  - {name: trailer, type: bin, start: 0x320668}
  - [0x320814]
