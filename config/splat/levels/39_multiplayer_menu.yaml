# Multiplayer Menu (level 39): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_39
sha1: f89056e67decc861592e06814b4a4afffbc5decb
options:
  basename: level_39
  target_path: baserom/levels/39_multiplayer_menu.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/39_multiplayer_menu/splat_assets
  asm_path: asm/levels/39_multiplayer_menu
  src_path: build/levels/39_multiplayer_menu/src
  ld_script_path: build/levels/39_multiplayer_menu/39_multiplayer_menu.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/39_multiplayer_menu/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/39_multiplayer_menu/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/39_multiplayer_menu/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x241A00}
  - {name: data, type: data, start: 0x213580, vram: 0x453F80}
  - {name: lvl_vtbl, type: data, start: 0x271B00, vram: 0x4B2500}
  - {name: lvl_camvtbl, type: data, start: 0x272580, vram: 0x4B2F80}
  - {name: lvl_sndvtbl, type: data, start: 0x272680, vram: 0x4B3080}
  - name: text
    type: code
    start: 0x272700
    vram: 0x4B3100
    subsegments:
      - [0x272700, c, text]
  - {name: trailer, type: bin, start: 0x4A0D18}
  - [0x4A0EC4]
