# Aquatos (level 8): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_08
sha1: 7121a587eca7ceff13e0dc747f1a12fe7a23ef76
options:
  basename: level_08
  target_path: baserom/levels/08_aquatos.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/08_aquatos/splat_assets
  asm_path: asm/levels/08_aquatos
  src_path: build/levels/08_aquatos/src
  ld_script_path: build/levels/08_aquatos/08_aquatos.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/08_aquatos/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/08_aquatos/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/08_aquatos/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xD0580, vram: 0x2A4C00}
  - {name: lvl_vtbl, type: data, start: 0x121900, vram: 0x2F5F80}
  - {name: lvl_camvtbl, type: data, start: 0x122580, vram: 0x2F6C00}
  - {name: lvl_sndvtbl, type: data, start: 0x122680, vram: 0x2F6D00}
  - name: text
    type: code
    start: 0x122700
    vram: 0x2F6D80
    subsegments:
      - [0x122700, c, text]
  - {name: trailer, type: bin, start: 0x327990}
  - [0x327B3C]
