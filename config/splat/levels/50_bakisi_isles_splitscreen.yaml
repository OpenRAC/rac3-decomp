# Bakisi Isles (split screen) (level 50): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_50
sha1: fce0076d59c4358de41b574a2b2f5945c92a0903
options:
  basename: level_50
  target_path: baserom/levels/50_bakisi_isles_splitscreen.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/50_bakisi_isles_splitscreen/splat_assets
  asm_path: asm/levels/50_bakisi_isles_splitscreen
  src_path: build/levels/50_bakisi_isles_splitscreen/src
  ld_script_path: build/levels/50_bakisi_isles_splitscreen/50_bakisi_isles_splitscreen.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/50_bakisi_isles_splitscreen/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/50_bakisi_isles_splitscreen/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/50_bakisi_isles_splitscreen/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x241A00}
  - {name: data, type: data, start: 0x170880, vram: 0x3B1280}
  - {name: lvl_vtbl, type: data, start: 0x194500, vram: 0x3D4F00}
  - {name: lvl_camvtbl, type: data, start: 0x195600, vram: 0x3D6000}
  - {name: lvl_sndvtbl, type: data, start: 0x195700, vram: 0x3D6100}
  - name: text
    type: code
    start: 0x195780
    vram: 0x3D6180
    subsegments:
      - [0x195780, c, text]
  - {name: trailer, type: bin, start: 0x31E4A0}
  - [0x31E64C]
