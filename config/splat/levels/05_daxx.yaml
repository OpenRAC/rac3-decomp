# Daxx (level 5): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_05
sha1: 2b3877caac6de716ace61b111855bbe24684938c
options:
  basename: level_05
  target_path: baserom/levels/05_daxx.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/05_daxx/splat_assets
  asm_path: asm/levels/05_daxx
  src_path: build/levels/05_daxx/src
  ld_script_path: build/levels/05_daxx/05_daxx.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/05_daxx/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/05_daxx/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/05_daxx/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xD3500, vram: 0x2A7B80}
  - {name: lvl_vtbl, type: data, start: 0x124B80, vram: 0x2F9200}
  - {name: lvl_camvtbl, type: data, start: 0x125A00, vram: 0x2FA080}
  - {name: lvl_sndvtbl, type: data, start: 0x125B00, vram: 0x2FA180}
  - name: text
    type: code
    start: 0x125B80
    vram: 0x2FA200
    subsegments:
      - [0x125B80, c, text]
  - {name: trailer, type: bin, start: 0x346A98}
  - [0x346C44]
