# Vid-comic 2 (level 33): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_33
sha1: 51592e036338094c4f5f53a748875187678c9aba
options:
  basename: level_33
  target_path: baserom/levels/33_vidcomic_2.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/33_vidcomic_2/splat_assets
  asm_path: asm/levels/33_vidcomic_2
  src_path: build/levels/33_vidcomic_2/src
  ld_script_path: build/levels/33_vidcomic_2/33_vidcomic_2.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/33_vidcomic_2/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/33_vidcomic_2/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/33_vidcomic_2/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xD0B80, vram: 0x2A5200}
  - {name: lvl_vtbl, type: data, start: 0x122000, vram: 0x2F6680}
  - {name: lvl_camvtbl, type: data, start: 0x122A00, vram: 0x2F7080}
  - {name: lvl_sndvtbl, type: data, start: 0x122B00, vram: 0x2F7180}
  - name: text
    type: code
    start: 0x122B80
    vram: 0x2F7200
    subsegments:
      - [0x122B80, c, text]
  - {name: trailer, type: bin, start: 0x321198}
  - [0x321344]
