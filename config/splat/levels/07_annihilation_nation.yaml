# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xD0C80, vram: 0x2A5300}
  - {name: lvl_vtbl, type: data, start: 0x124000, vram: 0x2F8680}
  - {name: lvl_camvtbl, type: data, start: 0x124D00, vram: 0x2F9380}
  - {name: lvl_sndvtbl, type: data, start: 0x124E00, vram: 0x2F9480}
  - name: text
    type: code
    start: 0x124E80
    vram: 0x2F9500
    subsegments:
      - [0x124E80, c, text]
  - {name: trailer, type: bin, start: 0x34C350}
  - [0x34C4FC]
