# Vid-comic 5 (level 35): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_35
sha1: e35bec5c2e797d9f2eb1b032cd7aaa9c2e25674c
options:
  basename: level_35
  target_path: baserom/levels/35_vidcomic_5.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/35_vidcomic_5/splat_assets
  asm_path: asm/levels/35_vidcomic_5
  src_path: build/levels/35_vidcomic_5/src
  ld_script_path: build/levels/35_vidcomic_5/35_vidcomic_5.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/35_vidcomic_5/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/35_vidcomic_5/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/35_vidcomic_5/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xD1300, vram: 0x2A5980}
  - {name: lvl_vtbl, type: data, start: 0x122880, vram: 0x2F6F00}
  - {name: lvl_camvtbl, type: data, start: 0x123280, vram: 0x2F7900}
  - {name: lvl_sndvtbl, type: data, start: 0x123380, vram: 0x2F7A00}
  - name: text
    type: code
    start: 0x123400
    vram: 0x2F7A80
    subsegments:
      - [0x123400, c, text]
  - {name: trailer, type: bin, start: 0x320840}
  - [0x3209EC]
