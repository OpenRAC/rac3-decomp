# Vid-comic 1 (level 31): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_31
sha1: 7de4e9c7fd22ea0ff0cce7c18427ca1a5239e654
options:
  basename: level_31
  target_path: baserom/levels/31_vidcomic_1.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/31_vidcomic_1/splat_assets
  asm_path: asm/levels/31_vidcomic_1
  src_path: build/levels/31_vidcomic_1/src
  ld_script_path: build/levels/31_vidcomic_1/31_vidcomic_1.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/31_vidcomic_1/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/31_vidcomic_1/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/31_vidcomic_1/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xD0980, vram: 0x2A5000}
  - {name: lvl_vtbl, type: data, start: 0x122280, vram: 0x2F6900}
  - {name: lvl_camvtbl, type: data, start: 0x122C80, vram: 0x2F7300}
  - {name: lvl_sndvtbl, type: data, start: 0x122D80, vram: 0x2F7400}
  - name: text
    type: code
    start: 0x122E00
    vram: 0x2F7480
    subsegments:
      - [0x122E00, c, text]
  - {name: trailer, type: bin, start: 0x31F660}
  - [0x31F80C]
