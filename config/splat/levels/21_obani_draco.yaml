# Obani Draco (level 21): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_21
sha1: 97188a12babe1657cd2249aa484cfb692e576c5f
options:
  basename: level_21
  target_path: baserom/levels/21_obani_draco.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/21_obani_draco/splat_assets
  asm_path: asm/levels/21_obani_draco
  src_path: build/levels/21_obani_draco/src
  ld_script_path: build/levels/21_obani_draco/21_obani_draco.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/21_obani_draco/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/21_obani_draco/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/21_obani_draco/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xD9B80, vram: 0x2AE200}
  - {name: lvl_vtbl, type: data, start: 0x12AC00, vram: 0x2FF280}
  - {name: lvl_camvtbl, type: data, start: 0x12B700, vram: 0x2FFD80}
  - {name: lvl_sndvtbl, type: data, start: 0x12B800, vram: 0x2FFE80}
  - name: text
    type: code
    start: 0x12B880
    vram: 0x2FFF00
    subsegments:
      - [0x12B880, c, text]
  - {name: trailer, type: bin, start: 0x324430}
  - [0x3245DC]
