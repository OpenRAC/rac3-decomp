# Marcadia (level 4): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_04
sha1: 7cd1b04a1fa84c888847e7032fed40962f041145
options:
  basename: level_04
  target_path: baserom/levels/04_marcadia.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/04_marcadia/splat_assets
  asm_path: asm/levels/04_marcadia
  src_path: build/levels/04_marcadia/src
  ld_script_path: build/levels/04_marcadia/04_marcadia.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/04_marcadia/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/04_marcadia/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/04_marcadia/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xD0500, vram: 0x2A4B80}
  - {name: lvl_vtbl, type: data, start: 0x122A00, vram: 0x2F7080}
  - {name: lvl_camvtbl, type: data, start: 0x123A80, vram: 0x2F8100}
  - {name: lvl_sndvtbl, type: data, start: 0x123B80, vram: 0x2F8200}
  - name: text
    type: code
    start: 0x123C00
    vram: 0x2F8280
    subsegments:
      - [0x123C00, c, text]
  - {name: trailer, type: bin, start: 0x357EC0}
  - [0x35806C]
