# Kerwan (level 16): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_16
sha1: 05669db35ead92b8c7685986de20e38070656e6e
options:
  basename: level_16
  target_path: baserom/levels/16_kerwan.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/16_kerwan/splat_assets
  asm_path: asm/levels/16_kerwan
  src_path: build/levels/16_kerwan/src
  ld_script_path: build/levels/16_kerwan/16_kerwan.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/16_kerwan/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/16_kerwan/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/16_kerwan/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xDB780, vram: 0x2AFE00}
  - {name: lvl_vtbl, type: data, start: 0x12DB80, vram: 0x302200}
  - {name: lvl_camvtbl, type: data, start: 0x12EB00, vram: 0x303180}
  - {name: lvl_sndvtbl, type: data, start: 0x12EC00, vram: 0x303280}
  - name: text
    type: code
    start: 0x12EC80
    vram: 0x303300
    subsegments:
      - [0x12EC80, c, text]
  - {name: trailer, type: bin, start: 0x35EDD8}
  - [0x35EF84]
