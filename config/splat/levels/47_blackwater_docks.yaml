# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x241A00}
  - {name: data, type: data, start: 0x167600, vram: 0x3A8000}
  - {name: lvl_vtbl, type: data, start: 0x18B180, vram: 0x3CBB80}
  - {name: lvl_camvtbl, type: data, start: 0x18BF00, vram: 0x3CC900}
  - {name: lvl_sndvtbl, type: data, start: 0x18C000, vram: 0x3CCA00}
  - name: text
    type: code
    start: 0x18C080
    vram: 0x3CCA80
    subsegments:
      - [0x18C080, c, text]
  - {name: trailer, type: bin, start: 0x3012E8}
  - [0x301494]
