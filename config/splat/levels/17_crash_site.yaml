# Crash Site (level 17): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_17
sha1: d55d5aca3b00159ec224c9d04b53dd8bfca20141
options:
  basename: level_17
  target_path: baserom/levels/17_crash_site.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/17_crash_site/splat_assets
  asm_path: asm/levels/17_crash_site
  src_path: build/levels/17_crash_site/src
  ld_script_path: build/levels/17_crash_site/17_crash_site.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/17_crash_site/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/17_crash_site/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/17_crash_site/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xD8B80, vram: 0x2AD200}
  - {name: lvl_vtbl, type: data, start: 0x129A80, vram: 0x2FE100}
  - {name: lvl_camvtbl, type: data, start: 0x12A580, vram: 0x2FEC00}
  - {name: lvl_sndvtbl, type: data, start: 0x12A680, vram: 0x2FED00}
  - name: text
    type: code
    start: 0x12A700
    vram: 0x2FED80
    subsegments:
      - [0x12A700, c, text]
  - {name: trailer, type: bin, start: 0x3266B0}
  - [0x32685C]
