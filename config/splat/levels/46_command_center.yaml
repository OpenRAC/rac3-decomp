# Command Center (level 46): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_46
sha1: 3fc9cc86a5bddd8dafb09a3a2dc44d507b87b397
options:
  basename: level_46
  target_path: baserom/levels/46_command_center.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/46_command_center/splat_assets
  asm_path: asm/levels/46_command_center
  src_path: build/levels/46_command_center/src
  ld_script_path: build/levels/46_command_center/46_command_center.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/46_command_center/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/46_command_center/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/46_command_center/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x241A00}
  - {name: data, type: data, start: 0x167280, vram: 0x3A7C80}
  - {name: lvl_vtbl, type: data, start: 0x18AD80, vram: 0x3CB780}
  - {name: lvl_camvtbl, type: data, start: 0x18BB00, vram: 0x3CC500}
  - {name: lvl_sndvtbl, type: data, start: 0x18BC00, vram: 0x3CC600}
  - name: text
    type: code
    start: 0x18BC80
    vram: 0x3CC680
    subsegments:
      - [0x18BC80, c, text]
  - {name: trailer, type: bin, start: 0x2FEA68}
  - [0x2FEC14]
