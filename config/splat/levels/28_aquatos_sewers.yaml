# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xCE500, vram: 0x2A2B80}
  - {name: lvl_vtbl, type: data, start: 0x11F380, vram: 0x2F3A00}
  - {name: lvl_camvtbl, type: data, start: 0x11FD80, vram: 0x2F4400}
  - {name: lvl_sndvtbl, type: data, start: 0x11FE80, vram: 0x2F4500}
  - name: text
    type: code
    start: 0x11FF00
    vram: 0x2F4580
    subsegments:
      - [0x11FF00, c, text]
  - {name: trailer, type: bin, start: 0x315330}
  - [0x3154DC]
