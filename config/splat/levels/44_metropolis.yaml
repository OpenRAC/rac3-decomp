# Metropolis (level 44): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_44
sha1: d6681e732716854602de9a4a89f1df1309bb5cbe
options:
  basename: level_44
  target_path: baserom/levels/44_metropolis.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/44_metropolis/splat_assets
  asm_path: asm/levels/44_metropolis
  src_path: build/levels/44_metropolis/src
  ld_script_path: build/levels/44_metropolis/44_metropolis.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/44_metropolis/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/44_metropolis/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/44_metropolis/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x241A00}
  - {name: data, type: data, start: 0x156980, vram: 0x397380}
  - {name: lvl_vtbl, type: data, start: 0x17A580, vram: 0x3BAF80}
  - {name: lvl_camvtbl, type: data, start: 0x17B700, vram: 0x3BC100}
  - {name: lvl_sndvtbl, type: data, start: 0x17B800, vram: 0x3BC200}
  - name: text
    type: code
    start: 0x17B880
    vram: 0x3BC280
    subsegments:
      - [0x17B880, c, text]
  - {name: trailer, type: bin, start: 0x301A28}
  - [0x301BD4]
