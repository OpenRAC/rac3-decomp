# Obani Moons (level 11): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_11
sha1: 0da808c0605c80e7caf473e797272c16961d39b1
options:
  basename: level_11
  target_path: baserom/levels/11_obani_moons.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/11_obani_moons/splat_assets
  asm_path: asm/levels/11_obani_moons
  src_path: build/levels/11_obani_moons/src
  ld_script_path: build/levels/11_obani_moons/11_obani_moons.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/11_obani_moons/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/11_obani_moons/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/11_obani_moons/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xD3F80, vram: 0x2A8600}
  - {name: lvl_vtbl, type: data, start: 0x125000, vram: 0x2F9680}
  - {name: lvl_camvtbl, type: data, start: 0x125C00, vram: 0x2FA280}
  - {name: lvl_sndvtbl, type: data, start: 0x125D00, vram: 0x2FA380}
  - name: text
    type: code
    start: 0x125D80
    vram: 0x2FA400
    subsegments:
      - [0x125D80, c, text]
  - {name: trailer, type: bin, start: 0x323778}
  - [0x323924]
