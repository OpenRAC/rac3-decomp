# Insomniac Museum (level 24): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_24
sha1: 79e9d151e51d6cc987b0327fcca186175052ded3
options:
  basename: level_24
  target_path: baserom/levels/24_insomniac_museum.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/24_insomniac_museum/splat_assets
  asm_path: asm/levels/24_insomniac_museum
  src_path: build/levels/24_insomniac_museum/src
  ld_script_path: build/levels/24_insomniac_museum/24_insomniac_museum.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/24_insomniac_museum/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/24_insomniac_museum/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/24_insomniac_museum/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xCEB00, vram: 0x2A3180}
  - {name: lvl_vtbl, type: data, start: 0x120000, vram: 0x2F4680}
  - {name: lvl_camvtbl, type: data, start: 0x120C80, vram: 0x2F5300}
  - {name: lvl_sndvtbl, type: data, start: 0x120D80, vram: 0x2F5400}
  - name: text
    type: code
    start: 0x120E00
    vram: 0x2F5480
    subsegments:
      - [0x120E00, c, text]
  - {name: trailer, type: bin, start: 0x332480}
  - [0x33262C]
