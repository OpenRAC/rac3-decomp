# Florana (level 2): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_02
sha1: 13679c255f1decfcf3950cf5e2667e6f6332f9e8
options:
  basename: level_02
  target_path: baserom/levels/02_florana.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/02_florana/splat_assets
  asm_path: asm/levels/02_florana
  src_path: build/levels/02_florana/src
  ld_script_path: build/levels/02_florana/02_florana.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/02_florana/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/02_florana/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/02_florana/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xCEA80, vram: 0x2A3100}
  - {name: lvl_vtbl, type: data, start: 0x11FC00, vram: 0x2F4280}
  - {name: lvl_camvtbl, type: data, start: 0x120780, vram: 0x2F4E00}
  - {name: lvl_sndvtbl, type: data, start: 0x120880, vram: 0x2F4F00}
  - name: text
    type: code
    start: 0x120900
    vram: 0x2F4F80
    subsegments:
      - [0x120900, c, text]
  - {name: trailer, type: bin, start: 0x31DC80}
  - [0x31DE2C]
