# Vid-comic (unnamed) (level 30): its program as tools/levels.py dump writes it. Made by
# tools/levels.py config; regenerate it rather than editing it.
name: level_30
sha1: ce93cb0a44fa9ab80d436fb0a755e7bcc19afac6
options:
  basename: level_30
  target_path: baserom/levels/30_vidcomic_unnamed.elf
  base_path: ../../..
  build_path: build
  asset_path: build/levels/30_vidcomic_unnamed/splat_assets
  asm_path: asm/levels/30_vidcomic_unnamed
  src_path: build/levels/30_vidcomic_unnamed/src
  ld_script_path: build/levels/30_vidcomic_unnamed/30_vidcomic_unnamed.splat.ld
  compiler: EEGCC
  platform: ps2
  find_file_boundaries: True
  gp_value: 0x001DC8B0
  symbol_addrs_path:
    - build/levels/30_vidcomic_unnamed/symbol_addrs.txt
  asm_function_macro: glabel
  asm_data_macro: dlabel
  migrate_rodata_to_functions: True
  generate_asm_macros_files: False
  undefined_funcs_auto_path: build/levels/30_vidcomic_unnamed/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/levels/30_vidcomic_unnamed/undefined_syms_auto.txt

# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xCF680, vram: 0x2A3D00}
  - {name: lvl_vtbl, type: data, start: 0x120B00, vram: 0x2F5180}
  - {name: lvl_camvtbl, type: data, start: 0x121500, vram: 0x2F5B80}
  - {name: lvl_sndvtbl, type: data, start: 0x121600, vram: 0x2F5C80}
  - name: text
    type: code
    start: 0x121680
    vram: 0x2F5D00
    subsegments:
      - [0x121680, c, text]
  - {name: trailer, type: bin, start: 0x3201C0}
  - [0x32036C]
