# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xCFD00, vram: 0x2A4380}
  - {name: lvl_vtbl, type: data, start: 0x122300, vram: 0x2F6980}
  - {name: lvl_camvtbl, type: data, start: 0x123280, vram: 0x2F7900}
  - {name: lvl_sndvtbl, type: data, start: 0x123380, vram: 0x2F7A00}
  - name: text
    type: code
    start: 0x123400
    vram: 0x2F7A80
    subsegments:
      - [0x123400, c, text]
  - {name: trailer, type: bin, start: 0x358D98}
  - [0x358F44]
