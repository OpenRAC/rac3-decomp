# frontbin's layout at the level's addresses: .lit, then .bss, which the file stores as zeros
# (part of the lit segment, as in frontbin), .data, the three lvl.* vtables and .text. The
# trailer is .shstrtab plus the section header table.
segments:
  - {name: header, type: bin, start: 0x0}
  - {name: lit, type: data, start: 0x1000, vram: 0x1D5680}
  - {name: data, type: data, start: 0xCF500, vram: 0x2A3B80}
  - {name: lvl_vtbl, type: data, start: 0x120980, vram: 0x2F5000}
  - {name: lvl_camvtbl, type: data, start: 0x121680, vram: 0x2F5D00}
  - {name: lvl_sndvtbl, type: data, start: 0x121780, vram: 0x2F5E00}
  - name: text
    type: code
    start: 0x121800
    vram: 0x2F5E80
    subsegments:
      - [0x121800, c, text]
  - {name: trailer, type: bin, start: 0x32D598}
  - [0x32D744]
